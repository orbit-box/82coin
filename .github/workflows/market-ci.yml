name: Validate 82coin Market
on:
  push:
    branches:
      - feature/paper-trading-terminal
      - hotfix/paper-chart-20261023
  pull_request:
    branches:
      - main
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
