name: Validate 82coin Market
on:
  push:
    branches:
      - feature/paper-trading-terminal
      - hotfix/paper-chart-20261023
      - feature/paper-futures-execution-20261103
  pull_request:
    branches:
      - main
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d coin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/coin_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
